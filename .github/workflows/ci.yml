name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.24'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build registry binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o bin/registry ./cmd/registry
          ls -lh bin/registry
          file bin/registry

      - uses: actions/upload-artifact@v4
        with:
          name: registry-linux-amd64
          path: bin/registry

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: registry-linux-amd64
          path: bin

      - name: Package deployment bundle
        env:
          ENV_FILE_SECRET: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p dist/deploy/server
          cp bin/registry dist/deploy/registry
          cp -r server/static server/templates dist/deploy/server/
          cp -r modules dist/deploy/modules
          cp deploy/clio-registry.user.service dist/deploy/
          cp scripts/remote-deploy.sh dist/deploy/
          chmod +x dist/deploy/remote-deploy.sh

          # Bake ENV_FILE into the bundle (multiline SSH env is unreliable).
          printf '%s\n' "$ENV_FILE_SECRET" > dist/deploy/deploy.env
          sed -i 's/^[[:space:]]*//; s/\r$//' dist/deploy/deploy.env
          {
            grep -v -E '^(DATA_DIR|STATIC_DIR|TEMPLATE_DIR)=' dist/deploy/deploy.env || true
            echo "DATA_DIR=__DATA_DIR__"
            echo "STATIC_DIR=__STATIC_DIR__"
            echo "TEMPLATE_DIR=__TEMPLATE_DIR__"
          } > dist/deploy/deploy.env.new
          mv dist/deploy/deploy.env.new dist/deploy/deploy.env
          grep -q '^PORT=' dist/deploy/deploy.env || echo 'PORT=8082' >> dist/deploy/deploy.env
          # Log only the port number length / presence, not secret values
          if grep -q '^PORT=8082$' dist/deploy/deploy.env; then
            echo "Bundle includes PORT=8082"
          elif grep -q '^PORT=' dist/deploy/deploy.env; then
            echo "Bundle includes a custom PORT"
          else
            echo "ERROR: PORT missing from deploy.env" >&2
            exit 1
          fi

          tar czf clio-deploy.tar.gz -C dist/deploy .

      - name: Copy bundle to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: clio-deploy.tar.gz
          target: /tmp

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"

            echo "Deploying as $(whoami) (home: $HOME)"

            rm -rf /tmp/clio-deploy
            mkdir -p /tmp/clio-deploy
            tar xzf /tmp/clio-deploy.tar.gz -C /tmp/clio-deploy

            sed \
              -e "s|__DATA_DIR__|$HOME/clio-data|g" \
              -e "s|__STATIC_DIR__|$HOME/clio-registry/server/static|g" \
              -e "s|__TEMPLATE_DIR__|$HOME/clio-registry/server/templates|g" \
              /tmp/clio-deploy/deploy.env > /tmp/clio-registry.env

            if grep -q '^PORT=8082$' /tmp/clio-registry.env; then
              echo "Using PORT=8082 from ENV_FILE"
            elif grep -q '^PORT=' /tmp/clio-registry.env; then
              echo "Using custom PORT from ENV_FILE"
            else
              echo "PORT missing; defaulting to 8082"
              echo 'PORT=8082' >> /tmp/clio-registry.env
            fi

            DEPLOY_MODE=user \
              DEPLOY_STAGING_DIR=/tmp/clio-deploy \
              DEPLOY_ENV_FILE=/tmp/clio-registry.env \
              bash /tmp/clio-deploy/remote-deploy.sh

            rm -rf /tmp/clio-deploy /tmp/clio-deploy.tar.gz /tmp/clio-registry.env

  release:
    name: Release Modules
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Package modules
        run: |
          cd modules
          tar czf ../clio-modules.tar.gz *.yaml
          cd ..
          sha256sum clio-modules.tar.gz > clio-modules.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            clio-modules.tar.gz
            clio-modules.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
