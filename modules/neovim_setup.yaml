name: neovim_setup
id: neovim_setup
version: 1.3.5
description: Neovim with a small plugin set for generating code, rewriting it, and editing
tags:
  - neovim
  - nvim
  - editor
  - gp.nvim
  - deepseek
  - setup
  - development
estimated_time: "5-15 minutes"

flows:
  - name: setup
    description: Neovim editor that generates code and rewrites a selection
    steps:
      - type: message
        content: |
          ╔══════════════════════════════════════════════════════════╗
          ║  ✨ Neovim — generate code, then edit it                  ║
          ╚══════════════════════════════════════════════════════════╝

          Installs Neovim and a small plugin set:
            • gp.nvim     generate code and rewrite a selection (DeepSeek)
            • nvim-tree   file tree
            • fzf         find a file
            • Comment     gcc comments a line
            • autopairs   insert the closing bracket
            • lualine     status line
            • gruvbox     colors

            ,ga   generate code after the cursor or selection
            ,gr   rewrite the current line, or the selected lines
            ,gc   open a chat beside the file
            ,e    file tree     ,p  find file     ,w  save     ,q  quit

          The API key is saved in ~/.config/gp/deepseek.key (mode 600).
          The editor config is ~/.config/nvim/init.lua.

      - type: confirm
        prompt: "Continue with Neovim setup?"
        default: yes
        on_no: abort

      - type: section
        title: "Install Neovim"
        steps:
          - type: command
            command: |
              if command -v pkg >/dev/null 2>&1 && [ -n "${PREFIX:-}" ]; then
                DEBIAN_FRONTEND=noninteractive pkg install -y neovim git curl fzf
              elif command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y neovim git curl fzf
              elif command -v brew >/dev/null 2>&1; then
                brew install neovim git curl fzf
              else
                echo "Install neovim, git, curl, and fzf with your package manager first."
                false
              fi
              command -v nvim >/dev/null 2>&1
              nvim --version | head -n 1 || true
            description: Installing Neovim, fzf, git, and curl
            show_output: true

      - type: section
        title: "Plugin Manager"
        steps:
          - type: command
            command: |
              curl -fLo "${XDG_DATA_HOME:-$HOME/.local/share}/nvim/site/autoload/plug.vim" --create-dirs \
                https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
            description: Installing vim-plug for Neovim
            show_output: true

      - type: section
        title: "Editor Config"
        steps:
          - type: command
            command: |
              mkdir -p "$HOME/.config/nvim" "$HOME/.config/gp" "$HOME/.local/state/nvim/undo"
              if [ -f "$HOME/.config/nvim/init.lua" ] && [ ! -f "$HOME/.config/nvim/init.lua.clio-backup" ]; then
                cp "$HOME/.config/nvim/init.lua" "$HOME/.config/nvim/init.lua.clio-backup"
                echo "Backed up existing init.lua to ~/.config/nvim/init.lua.clio-backup"
              fi
              if [ -f "$HOME/.config/nvim/init.vim" ]; then
                echo "Note: ~/.config/nvim/init.lua overrides init.vim. Your init.vim was left in place."
              fi
              cat > "$HOME/.config/nvim/init.lua" << 'NVEOF'
              -- Neovim for writing code, set up by Clio.
              -- Leader is comma.
              --   ,w   save          ,q   quit         ,e   file tree
              --   ,p   find file     Ctrl-p  find file
              --   ,gc  AI chat       ,ga  generate after the cursor
              --   ,gr  rewrite the current line, or a visual selection
              --   gcc  comment the current line
              -- Model lives in the agents below. deepseek-flash is the default.
              -- Change it to deepseek-v4-pro for a stronger model.
              -- Key file: ~/.config/gp/deepseek.key

              vim.g.mapleader = ","
              vim.g.maplocalleader = ","

              vim.opt.number = true
              vim.opt.relativenumber = true
              vim.opt.cursorline = true
              vim.opt.showmatch = true
              vim.opt.wildmenu = true
              vim.opt.wildmode = "longest:full,full"
              vim.opt.laststatus = 2
              vim.opt.ruler = true
              vim.opt.showcmd = true
              vim.opt.scrolloff = 5
              vim.opt.autoindent = true
              vim.opt.smartindent = true
              vim.opt.expandtab = true
              vim.opt.shiftwidth = 4
              vim.opt.tabstop = 4
              vim.opt.softtabstop = 4
              vim.opt.ignorecase = true
              vim.opt.smartcase = true
              vim.opt.incsearch = true
              vim.opt.hlsearch = true
              vim.opt.hidden = true
              vim.opt.history = 1000
              vim.opt.undolevels = 1000
              vim.opt.backspace = { "indent", "eol", "start" }
              vim.opt.encoding = "utf-8"
              vim.opt.fileencoding = "utf-8"
              vim.opt.mouse = "a"
              vim.opt.clipboard = "unnamedplus"
              vim.opt.autoread = true
              vim.opt.lazyredraw = true
              vim.opt.backup = false
              vim.opt.writebackup = false
              vim.opt.swapfile = false
              vim.opt.undofile = true
              vim.opt.splitbelow = true
              vim.opt.splitright = true
              vim.opt.termguicolors = false
              vim.opt.background = "dark"

              local undodir = vim.fn.expand("~/.local/state/nvim/undo")
              if vim.fn.isdirectory(undodir) == 0 then
                vim.fn.mkdir(undodir, "p")
              end
              vim.opt.undodir = undodir

              vim.keymap.set("n", "<leader>w", "<cmd>w<cr>")
              vim.keymap.set("n", "<leader>q", "<cmd>q<cr>")
              vim.keymap.set("n", "<leader><space>", "<cmd>nohlsearch<cr>")
              vim.keymap.set("n", "<C-h>", "<C-w>h")
              vim.keymap.set("n", "<C-j>", "<C-w>j")
              vim.keymap.set("n", "<C-k>", "<C-w>k")
              vim.keymap.set("n", "<C-l>", "<C-w>l")
              vim.keymap.set("v", "<", "<gv")
              vim.keymap.set("v", ">", ">gv")

              vim.api.nvim_create_autocmd("FileType", {
                pattern = { "javascript", "typescript", "json", "html", "css", "scss", "yaml", "lua" },
                callback = function()
                  vim.opt_local.shiftwidth = 2
                  vim.opt_local.tabstop = 2
                  vim.opt_local.softtabstop = 2
                end,
              })
              vim.api.nvim_create_autocmd("FileType", {
                pattern = "go",
                callback = function()
                  vim.opt_local.expandtab = false
                  vim.opt_local.shiftwidth = 4
                  vim.opt_local.tabstop = 4
                end,
              })

              if vim.fn.exists("*plug#begin") == 1 or vim.fn.filereadable(vim.fn.stdpath("data") .. "/site/autoload/plug.vim") == 1 then
                local plug_path = vim.fn.stdpath("data") .. "/site/plugged"
                vim.cmd("call plug#begin('" .. plug_path .. "')")
                vim.cmd("Plug 'ellisonleao/gruvbox.nvim'")
                vim.cmd("Plug 'nvim-tree/nvim-tree.lua'")
                vim.cmd("Plug 'nvim-lualine/lualine.nvim'")
                vim.cmd("Plug 'numToStr/Comment.nvim'")
                vim.cmd("Plug 'windwp/nvim-autopairs'")
                vim.cmd("Plug 'junegunn/fzf.vim'")
                vim.cmd("Plug 'Robitx/gp.nvim'")
                vim.cmd("call plug#end()")
              else
                vim.notify("vim-plug is missing. Re-run: setup neovim", vim.log.levels.WARN)
              end

              local function setup_plugin(name, configure)
                local ok, mod = pcall(require, name)
                if not ok then
                  return false
                end
                if configure then
                  local configured, err = pcall(configure, mod)
                  if not configured then
                    vim.notify(name .. ": " .. tostring(err), vim.log.levels.WARN)
                    return false
                  end
                end
                return true
              end

              pcall(vim.cmd.colorscheme, "gruvbox")

              if not setup_plugin("nvim-tree", function(mod)
                vim.g.loaded_netrw = 1
                vim.g.loaded_netrwPlugin = 1
                mod.setup({
                  view = { width = 28 },
                  git = { enable = false },
                  renderer = {
                    icons = {
                      show = { file = false, folder = false, folder_arrow = true, git = false, modified = false },
                      glyphs = {
                        folder = { arrow_closed = ">", arrow_open = "v" },
                      },
                    },
                  },
                })
                vim.keymap.set("n", "<leader>e", "<cmd>NvimTreeToggle<cr>")
                vim.keymap.set("n", "<leader>f", "<cmd>NvimTreeFindFile<cr>")
              end) then
                vim.keymap.set("n", "<leader>e", "<cmd>Lexplore<cr>")
              end

              setup_plugin("lualine", function(mod)
                mod.setup({ options = { icons_enabled = false, theme = "auto" } })
              end)

              setup_plugin("Comment", function(mod)
                mod.setup()
              end)

              setup_plugin("nvim-autopairs", function(mod)
                mod.setup()
              end)

              if vim.fn.exists(":Files") == 2 then
                vim.keymap.set("n", "<C-p>", "<cmd>Files<cr>")
                vim.keymap.set("n", "<leader>p", "<cmd>Files<cr>")
              end

              local ok, gp = pcall(require, "gp")
              if not ok then
                vim.notify("gp.nvim is not installed yet. Run :PlugInstall", vim.log.levels.WARN)
              else
                gp.setup({
                  default_chat_agent = "ChatDeepSeek",
                  default_command_agent = "CodeDeepSeek",
                  providers = {
                    openai = {
                      endpoint = "https://api.deepseek.com/chat/completions",
                      secret = { "bash", "-c", "key=$(llm keys get deepseek 2>/dev/null | tr -d '[:space:]'); if [ -z \"$key\" ] && [ -f \"$HOME/.config/gp/deepseek.key\" ]; then key=$(tr -d '[:space:]' < \"$HOME/.config/gp/deepseek.key\"); fi; if [ -n \"$key\" ]; then printf '%s' \"$key\"; else exit 1; fi" },
                    },
                  },
                  agents = {
                    { name = "ChatGPT4o", disable = true },
                    { name = "ChatGPT4o-mini", disable = true },
                    { name = "ChatGPT-o3-mini", disable = true },
                    { name = "CodeGPT4o", disable = true },
                    { name = "CodeGPT-o3-mini", disable = true },
                    { name = "CodeGPT4o-mini", disable = true },
                    {
                      provider = "openai",
                      name = "ChatDeepSeek",
                      chat = true,
                      command = false,
                      model = { model = "deepseek-flash", temperature = 0.7, top_p = 1, max_completion_tokens = 400 },
                      system_prompt = "You are a helper on a phone. Answer in a few short sentences.",
                    },
                    {
                      provider = "openai",
                      name = "CodeDeepSeek",
                      chat = false,
                      command = true,
                      model = { model = "deepseek-flash", temperature = 0.2, top_p = 1, max_completion_tokens = 16384 },
                      system_prompt = "You are an AI working as a code editor.\n\nWhen the user asks for a web page, write the complete HTML document in one reply. Share the navigation bar and the footer across pages. Shape the main content for this page. A hero belongs on the home page only. Do not add a style element. Do not shorten the page or use placeholders.\n\nPlease AVOID COMMENTARY OUTSIDE OF THE SNIPPET RESPONSE.\nSTART AND END YOUR ANSWER WITH:\n\n```",
                    },
                  },
                })

                local site_rules = " This site uses Pico CSS 2.1.1 at css/pico.min.css. Link it with <link rel=\"stylesheet\" href=\"css/pico.min.css\">. Do not add a style element. Do not create or edit a CSS file. Write one complete HTML document. The html element has lang and data-theme=\"light\". header class=\"container\" holds one nav, with a short list of relative links. The current page link has aria-current=\"page\". On a phone the nav stacks into a vertical list; do not write CSS for that. footer class=\"container\" comes after main and holds a small line plus the same links. Choose the main content for this page. Use a hero only on the home page (index.html, or a page the user called a homepage or landing page): an hgroup with an h1 and one p, a short paragraph, one link with role=\"button\", and a second link with role=\"button\" and class=\"secondary\". A listed photo may sit beside that text in class=\"grid\". Do not put a hero on an about page, a contact page, or any other page. An about page is a heading and paragraphs. A contact page is a form. A set of items may be a section class=\"grid\" of articles, each with an h2 and a paragraph. Link pages with relative hrefs such as index.html and about.html."

                local function image_list()
                  local dir = vim.fn.fnamemodify(vim.api.nvim_buf_get_name(0), ":h")
                  if dir == "" then
                    dir = vim.fn.getcwd()
                  end
                  local found = {}
                  for _, folder in ipairs({ "images", "assets" }) do
                    local base = dir .. "/" .. folder
                    if vim.fn.isdirectory(base) == 1 then
                      for _, ext in ipairs({ "jpg", "jpeg", "png", "webp", "gif", "svg", "JPG", "JPEG", "PNG", "WEBP" }) do
                        local files = vim.fn.glob(base .. "/*." .. ext, false, true)
                        for _, file in ipairs(files) do
                          table.insert(found, folder .. "/" .. vim.fn.fnamemodify(file, ":t"))
                        end
                      end
                    end
                  end
                  if #found == 0 then
                    return " No files are in images/ or assets/. Do not invent image addresses and do not download images."
                  end
                  return " Use only these image files, each with an alt sentence, and only where this page needs a picture: " .. table.concat(found, ", ") .. ". Do not invent other image addresses."
                end

                local function ask(label, cmd, range)
                  vim.ui.input({ prompt = label }, function(input)
                    if not input or input:match("^%s*$") then
                      return
                    end
                    local full = input
                    if vim.api.nvim_buf_get_name(0):match("%.html?$") then
                      full = input .. site_rules .. image_list()
                    end
                    vim.schedule(function()
                      vim.api.nvim_cmd({ cmd = cmd, args = { full }, range = range }, {})
                    end)
                  end)
                end

                vim.keymap.set("n", "<leader>gc", "<cmd>GpChatNew vsplit<cr>", { desc = "AI chat" })
                vim.keymap.set("n", "<leader>ga", function()
                  local line = vim.api.nvim_win_get_cursor(0)[1]
                  ask("Generate: ", "GpAppend", { line, line })
                end, { desc = "Generate code after cursor" })
                vim.keymap.set("n", "<leader>gr", function()
                  local line = vim.api.nvim_win_get_cursor(0)[1]
                  ask("Rewrite: ", "GpRewrite", { line, line })
                end, { desc = "Rewrite this line" })
                vim.keymap.set("v", "<leader>ga", function()
                  local a = vim.fn.line("v")
                  local b = vim.fn.line(".")
                  ask("Generate: ", "GpAppend", { math.min(a, b), math.max(a, b) })
                end, { desc = "Generate code after selection" })
                vim.keymap.set("v", "<leader>gr", function()
                  local a = vim.fn.line("v")
                  local b = vim.fn.line(".")
                  ask("Rewrite: ", "GpRewrite", { math.min(a, b), math.max(a, b) })
                end, { desc = "Rewrite selection" })
              end
              NVEOF
            description: Writing ~/.config/nvim/init.lua
            show_output: true

      - type: section
        title: "DeepSeek API Key"
        steps:
          - type: command
            command: |
              KEY_FILE="$HOME/.config/gp/deepseek.key"
              mkdir -p "$(dirname "$KEY_FILE")"
              SAVED=$(llm keys get deepseek 2>/dev/null | tr -d '[:space:]' || true)
              if [ -n "$SAVED" ]; then
                umask 077
                printf '%s' "$SAVED" > "$KEY_FILE"
                chmod 600 "$KEY_FILE"
                echo "Neovim will use the DeepSeek key already saved for clio ask."
                REPLACE=n
              else
                REPLACE=y
              fi
              if [ "$REPLACE" = "y" ] && [ -s "$KEY_FILE" ]; then
                echo "A DeepSeek key is already at $KEY_FILE"
                read -r -p "Replace it? [y/N]: " REPLACE || REPLACE=n
                REPLACE=$(printf '%s' "$REPLACE" | tr '[:upper:]' '[:lower:]')
              fi
              if [ "$REPLACE" = "y" ] || [ "$REPLACE" = "yes" ]; then
                echo "Get a key at https://platform.deepseek.com/api_keys"
                read -r -s -p "DeepSeek API key (hidden, Enter to skip): " KEY || KEY=""
                echo
                if [ -n "$KEY" ]; then
                  umask 077
                  printf '%s' "$KEY" > "$KEY_FILE"
                  chmod 600 "$KEY_FILE"
                  echo "Key saved. Neovim reads it when you generate or edit code."
                else
                  echo "Skipped. Save a key later with: nvim $KEY_FILE"
                fi
              fi
            description: Saving the DeepSeek API key
            show_output: true
            interactive: true

      - type: section
        title: "Install plugins"
        steps:
          - type: command
            command: |
              nvim --headless "+PlugInstall" "+qa"
            description: Installing plugins (needs a network connection)
            show_output: true
            continue_on_error: true

      - type: message
        content: |
          ╔══════════════════════════════════════════════════════════╗
          ║  ✅ Neovim setup complete                                 ║
          ╚══════════════════════════════════════════════════════════╝

          Open a file:   nvim index.html

          Generate:      put the cursor where the code should go, press ,ga
                         type what you want, press Enter
          HTML files:    Pico rules are added to that prompt for you
          Edit with AI:  select lines with V, press ,gr, say what to change
          Chat:          ,gc
          Find a file:   ,p or Ctrl-p
          Comment:       gcc on a line, gc on a selection
          Plain editing: ,w saves, ,q quits, ,e is the file tree

          Config:  nvim ~/.config/nvim/init.lua
          Key:     ~/.config/gp/deepseek.key
          Plugins: open Neovim and run :PlugUpdate

          gp.nvim cannot turn DeepSeek's thinking mode off. The first reply
          can take longer and use more data. The text that lands in the
          buffer is the answer, not the reasoning.
