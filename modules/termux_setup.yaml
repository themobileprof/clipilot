name: Termux Complete Setup
id: termux_setup
version: 1.2.10
description: Complete development environment setup for Termux including Zsh, Git, LLM, and dev languages
tags:
  - termux
  - setup
  - configuration
  - development
  - first-run

requires_termux: true
estimated_time: "10-20 minutes"

flows:
  - name: setup
    description: Interactive setup wizard for first-time Termux users
    steps:
      - type: message
        content: |
          ╔══════════════════════════════════════════════════════════╗
          ║       🚀 Termux Complete Setup Wizard                   ║
          ╚══════════════════════════════════════════════════════════╝
          
          This will configure your Termux environment with:
            • System updates & mirrors
            • Android storage access
            • Zsh shell with themes
            • Essential dev tools (git, gh, llm)
            • Optional: HTML pages (Pico CSS saved on the device), PHP, Node.js, Golang, Python
          
          This process may take 10-20 minutes.

      - type: confirm
        prompt: "Continue with setup?"
        default: yes
        on_no: abort

      - type: section
        title: "Update & Upgrade"
        steps:
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg update -y
            description: Updating package lists
            show_output: true
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive DEBIAN_PRIORITY=critical pkg upgrade -y
            description: Upgrading packages
            show_output: true

      - type: section
        title: "Configure Mirrors"
        steps:
          - type: check_command
            command: termux-change-repo
            on_missing: skip
          
          - type: message
            content: "Running termux-change-repo (select mirrors from the menu)"
          
          - type: command
            command: termux-change-repo
            interactive: true
            continue_on_error: true

      - type: section
        title: "Setup Android Storage"
        steps:
          - type: message
            content: "Setting up access to Android storage. You will be prompted to grant permissions."
          
          - type: command
            command: termux-setup-storage
            interactive: true
            continue_on_error: true
          
          - type: message
            content: "Storage will be accessible at ~/storage/"

      - type: section
        title: "Install Essential Tools"
        steps:
          - type: message
            content: "Installing essential tools: ca-certificates, git, gh, curl, wget, man, openssh, zip, unzip"
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y ca-certificates git gh curl wget man openssh zip unzip
            show_output: true

      - type: section
        title: "Install Zsh & Themes"
        steps:
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y zsh
            description: Installing Zsh shell
            show_output: true
          
          - type: check_path
            path: ~/.oh-my-zsh
            on_exists: skip_to_p10k
          
          - type: message
            content: "Installing Oh My Zsh..."
          
          - type: command
            command: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
            continue_on_error: true
          
          - type: label
            name: skip_to_p10k
          
          - type: check_path
            path: ~/.oh-my-zsh/custom/themes/powerlevel10k
            on_exists: skip_to_zshrc
          
          - type: message
            content: "Installing Powerlevel10k theme..."
          
          - type: command
            command: git clone --depth=1 https://github.com/romkatv/powerlevel10k.git ~/.oh-my-zsh/custom/themes/powerlevel10k
            continue_on_error: true
          
          - type: label
            name: skip_to_zshrc
          
          - type: file_operation
            operation: configure_zshrc
            description: Configuring .zshrc with theme and aliases
          
          - type: command
            command: chsh -s zsh
            description: Setting Zsh as default shell
            continue_on_error: true

      - type: section
        title: "Neovim"
        steps:
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y neovim
            description: Installing Neovim
            show_output: true
            continue_on_error: true

          - type: message
            content: |
              Neovim is installed. Plugins, DeepSeek, and key maps are a
              second wizard. After this one finishes, run:

                clio neovim_setup

      - type: section
        title: "Install LLM Tool"
        steps:
          - type: check_command
            command: python
            on_missing: install_python
          
          - type: goto
            label: install_llm
          
          - type: label
            name: install_python
          
          - type: message
            content: "Installing Python..."
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y python
            show_output: true
          
          - type: label
            name: install_llm
          
          - type: message
            content: "Installing llm via pip..."
          
          - type: command
            command: "python -m pip install --upgrade-strategy only-if-needed --only-binary=jiter,pydantic-core --extra-index-url https://pypi.flet.dev/ --extra-index-url https://eutalix.github.io/android-pydantic-core/ 'jiter==0.15.0' 'pydantic-core==2.50.0' 'pydantic==2.14.0' 'llm==0.32.1' llm-deepseek llm-gemini"
            description: Installing the model program
            show_output: true
            continue_on_error: true
          
          - type: message
            content: |
              
              ╔══════════════════════════════════════════════════════════╗
              ║  DeepSeek LLM Integration                                ║
              ╚══════════════════════════════════════════════════════════╝
              
              DeepSeek offers powerful AI with affordable API rates.
              Get your API key at: https://platform.deepseek.com/api_keys
          
          - type: confirm
            prompt: "Do you have a DeepSeek API key?"
            default: no
            on_no: skip_deepseek
          
          - type: command
            description: Checking and saving the DeepSeek key
            interactive: true
            show_output: true
            command: |
              while true; do
                if clio key deepseek; then
                  echo "DeepSeek is ready."
                  echo "Ask:  clio ask 'your question'"
                  break
                fi
                printf 'Try another DeepSeek key? [y/N] '
                ans=
                if ! IFS= read -r ans; then
                  echo "Skipping the DeepSeek key."
                  echo "You can save it later with: clio key deepseek"
                  break
                fi
                ans=$(printf '%s' "$ans" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
                case "$ans" in
                  y|yes) ;;
                  *)
                    echo "Skipping the DeepSeek key."
                    echo "You can save it later with: clio key deepseek"
                    break
                    ;;
                esac
              done
          
          - type: goto
            label: after_deepseek
          
          - type: label
            name: skip_deepseek
          
          - type: message
            content: |
              
              You can save the DeepSeek key later by running:
                clio key deepseek
              Then ask with:
                clio ask 'your question'
          
          - type: label
            name: after_deepseek

          - type: message
            content: |
              
              ╔══════════════════════════════════════════════════════════╗
              ║  Gemini                                                  ║
              ╚══════════════════════════════════════════════════════════╝
              
              Gemini 3.8 Flash is free of charge for a new AI Studio key.
              Get your API key at: https://aistudio.google.com/apikey
          
          - type: confirm
            prompt: "Do you have a Gemini API key?"
            default: no
            on_no: skip_gemini
          
          - type: command
            description: Checking and saving the Gemini key
            interactive: true
            show_output: true
            command: |
              while true; do
                if clio key gemini; then
                  echo "Gemini is ready."
                  echo "To ask Gemini instead of DeepSeek, run: clio model gemini"
                  break
                fi
                printf 'Try another Gemini key? [y/N] '
                ans=
                if ! IFS= read -r ans; then
                  echo "Skipping the Gemini key."
                  echo "You can save it later with: clio key gemini"
                  break
                fi
                ans=$(printf '%s' "$ans" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
                case "$ans" in
                  y|yes) ;;
                  *)
                    echo "Skipping the Gemini key."
                    echo "You can save it later with: clio key gemini"
                    break
                    ;;
                esac
              done
          
          - type: goto
            label: after_gemini
          
          - type: label
            name: skip_gemini
          
          - type: message
            content: |
              
              You can save the Gemini key later by running:
                clio key gemini
              To ask Gemini instead of DeepSeek, run:
                clio model gemini
          
          - type: label
            name: after_gemini

      - type: section
        title: "Optional Dev Languages"
        steps:
          - type: message
            content: |
              
              Optional Development Languages
              Choose languages to install (you can install more later with pkg install)
          
          - type: command
            interactive: true
            continue_on_error: true
            description: Pico CSS for HTML pages
            command: |
              echo "HTML pages use Pico CSS. A yes saves it on this device for later."
              read -r -p "Build HTML pages? [Y/n]: " BUILD_HTML || BUILD_HTML=n
              BUILD_HTML=$(printf '%s' "$BUILD_HTML" | tr '[:upper:]' '[:lower:]')
              if [ -z "$BUILD_HTML" ] || [ "$BUILD_HTML" = "y" ] || [ "$BUILD_HTML" = "yes" ]; then
                mkdir -p "$HOME/.clio/share"
                if curl -fsSL -o "$HOME/.clio/share/pico.min.css" \
                    https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css \
                  && [ -s "$HOME/.clio/share/pico.min.css" ]; then
                  echo "Saved Pico CSS to ~/.clio/share/pico.min.css"
                else
                  rm -f "$HOME/.clio/share/pico.min.css"
                  echo "Could not download Pico CSS. Copy it into a site later from the CDN."
                fi
              else
                echo "Skipped Pico CSS."
              fi

          - type: check_command
            command: php
            on_exists: skip_php
          
          - type: confirm
            prompt: "Install PHP?"
            default: no
            on_no: skip_php
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y php
            description: Installing PHP
            show_output: true
            continue_on_error: true
          
          - type: label
            name: skip_php
          
          - type: check_command
            command: node
            on_exists: skip_node
          
          - type: confirm
            prompt: "Install Node.js?"
            default: no
            on_no: skip_node
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y nodejs
            description: Installing Node.js
            show_output: true
            continue_on_error: true
          
          - type: label
            name: skip_node
          
          - type: check_command
            command: go
            on_exists: skip_go
          
          - type: confirm
            prompt: "Install Golang?"
            default: no
            on_no: skip_go
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y golang
            description: Installing Golang
            show_output: true
            continue_on_error: true
          
          - type: label
            name: skip_go
          
          - type: check_command
            command: python
            on_exists: skip_python
          
          - type: confirm
            prompt: "Install Python?"
            default: no
            on_no: skip_python
          
          - type: command
            command: DEBIAN_FRONTEND=noninteractive pkg install -y python
            description: Installing Python
            show_output: true
            continue_on_error: true
          
          - type: label
            name: skip_python

      - type: message
        content: |
          
          ╔══════════════════════════════════════════════════════════╗
          ║  ✅ Termux setup complete!                               ║
          ╚══════════════════════════════════════════════════════════╝
          
          Restart Termux to apply all changes (especially Zsh).
          Run 'clio' again to start using your assistant.
      
      - type: file_operation
        operation: mark_complete
        description: Marking setup as complete
